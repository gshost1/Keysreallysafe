name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/Fixtures/claude-home
      GROK_HOME: ${{ github.workspace }}/Fixtures/grok-home
      GROK_BOT_HOME: ${{ github.workspace }}/Fixtures/grok-bot-home
      KEYS_DROID_HOME: ${{ github.workspace }}/Fixtures/droid-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test with synthetic fixtures
        run: swift test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scripts/tests/package-lock.json
            Relay/package-lock.json
      - name: Install the pinned browser test dependencies
        working-directory: scripts/tests
        run: npm ci
      - name: Install the relay Worker's pinned tooling
        working-directory: Relay
        run: npm ci
      # Runs inside workerd with a throwaway secret: no Cloudflare account, no network.
      - name: Check the relay Worker offline
        working-directory: Relay
        run: npm test
      - name: Check release packaging scripts (no credentials)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check analytics collector (synthetic loopback requests only)
        run: |
          python3 -m unittest Analytics/test_collector.py
      - name: Install the pinned browser
        working-directory: scripts/tests
        run: npx --no-install playwright install chromium
      - name: Check dashboard workflows in a real browser (synthetic local fixtures only)
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/tests/node_modules
        run: |
          node scripts/tests/test_keys_dashboard_ui.cjs
          node scripts/tests/test_analytics_ui.cjs
      - name: Check tester-army dashboard flows (synthetic fixture server only)
        working-directory: scripts/tests
        run: npm run test:e2e
      # The same real assets against the real Swift backend on a temporary
      # synthetic vault: no keychain, Touch ID, clipboard or provider call.
      # KEYS_CONTRACT_TIMEOUT_S bounds the browser half inside the test; the step
      # timeout is the backstop, so a wedged browser fails the step rather than
      # holding the runner open.
      - name: Check the dashboard against the real backend (synthetic vault only)
        timeout-minutes: 15
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/tests/node_modules
          KEYS_BACKEND_CONTRACT_UI: "1"
        run: swift test --filter BackendContractUITests
