services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - analytics-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    networks:
      - analytics-internal

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
    environment:
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN:?set ANALYTICS_DOMAIN to the chosen collector hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    networks:
      - analytics-internal
      - analytics-edge

networks:
  analytics-internal:
    internal: true
  analytics-edge:

volumes:
  analytics-data:
  caddy-data:
  caddy-config:
